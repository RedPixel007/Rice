<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class = "user_name">{{ user_name }}</div>
<div align="center">
    <br><br>
    <a>Создать тариф</a>
    <br><br>
    <a href = "{{ url_for('plan_bp.clear_basket') }}" class = "btn">Очистить варианты</a>
</div>

{% import 'basket_utils.html' as utils %}
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <h2>Все товары</h2>
                {% for key in plan.keys() %}
                    {{ utils.render_item(plan, key, False, basket) }}
                {% endfor %}
        </div>
        <div class="col-md-4">
            <h2>Корзина</h2>
                {% for key in plan.keys() %}
                    {{ utils.render_item(plan, key, True, basket) }}
                {% endfor %}
        </div>
    </div>
</div>

</body>
</html>
