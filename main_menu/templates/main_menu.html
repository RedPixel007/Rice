<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Menu</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class = "user_name">{{ user_name }}</div>
    <center>
        <h1>Оператор сотовой связи</h1>
        <br><br><br>
        <h2>Главное меню</h2>
        {% if 'query_bp' in access %}
            <br>
            <a href="{{ url_for('query_bp.query_menu_handler') }}" class = "btn">Работа с запросами</a>
            <br><br>
        {% endif %}

        {% if 'plan_bp' in access %}
            <a href="{{ url_for('plan_bp.tariff_page') }}" class = "btn">Работа с тарифами</a>
            <br><br>
        {% endif %}
        <a href="{{ url_for('exit_func') }}" class = "back_btn">Выход из системы</a>
    </center>
</body>
</html>
