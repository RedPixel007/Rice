<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Оператор Сотовой связи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class = "user_name">{{ user_name }}</div>
<center>
    <h1>{{ html_title }}</h1>
    <table>
            {% for col in column %}
                <th>{{ col }}</th>
            {% endfor %}

            <tbody>
                {% for row in answer %}
                    <tr>
                        {% for key in row %}
                            <td>{{ row[key] }}</td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>

    </table>
    <br><br>
    <a href="{{ url_for('query_bp.query_menu_handler') }}" class = "back_btn">Вернуться к запросам</a>
    <br><br>
    <a href="{{ url_for('main_menu') }}" class = "back_btn">Вернуться в главное меню</a>
</center>
</body>
</html>
