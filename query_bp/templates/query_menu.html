<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class = "user_name">{{ user_name }}</div>
<center>
    <h2>Меню запросов</h2>
        {% for key in keys %}
            {% if group in config[key]["group"] %}
                <a href="{{ url_for('query_bp.query_handler', query_id = key) }}" class = "btn"> {{ query_form[key]["query_name"] }} </a>
                <br><br>
            {% endif %}

        {% endfor %}
    <br><br>
    <a href="{{ url_for('main_menu') }}" class = "back_btn">Вернуться в главное меню</a>
</center>
</body>
</html>
